name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.25
      - run: P2T_PUBLIC_REPO=example/homebrew-push2talk mise run prepare-release
      - uses: actions/upload-artifact@v4
        with:
          name: Push2Talk-preview
          path: |
            dist/Push2Talk-*.zip
            dist/Push2Talk-*.sha256
            dist/homebrew-push2talk/
