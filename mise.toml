[env]
TMUX_WINDOW_TITLE = "p2talk"

[tasks.tmux]
description = "Rename the current window, split panes, and execute development commands"
run = """
#!/bin/bash

# Ensure this command is run within a TMux session
if [ -z "$TMUX" ]; then
  echo "Error: This command must be run inside a TMux session."
  exit 1
fi

PROJECT_DIR="$(pwd -P)"
# Target the pane running this task, not the active pane of the client,
# so switching windows/panes during startup does not misdirect commands
ORIGINAL_PANE_ID="$TMUX_PANE"

# Rename the window that owns this pane
tmux rename-window -t "$ORIGINAL_PANE_ID" "$TMUX_WINDOW_TITLE"

# Start agy in the original pane (top)
tmux send-keys -t "$ORIGINAL_PANE_ID" "agy" C-m

# Split below the original pane without moving focus (-d)
tmux split-window -d -v -l 50% -t "$ORIGINAL_PANE_ID" -c "$PROJECT_DIR"
"""

[tasks.test]
description = "Run Swift tests"
run = "swift test --scratch-path .build --cache-path .build/cache"

[tasks."bump:patch:commit"]
description = "Increment the patch version and commit it (requires a clean working tree)"
dir = "{{ config_root }}"
run = '''
#!/bin/bash
set -euo pipefail
exec /bin/bash scripts/bump-version.sh patch "$@"
'''

[tasks."bump:minor:commit"]
description = "Increment the minor version and commit it (requires a clean working tree)"
dir = "{{ config_root }}"
run = '''
#!/bin/bash
set -euo pipefail
exec /bin/bash scripts/bump-version.sh minor "$@"
'''

[tasks."bump:major:commit"]
description = "Increment the major version and commit it (requires a clean working tree)"
dir = "{{ config_root }}"
run = '''
#!/bin/bash
set -euo pipefail
exec /bin/bash scripts/bump-version.sh major "$@"
'''

[tasks.bundle]
description = "Build the local app bundle"
dir = "{{ config_root }}"
run = '''
#!/bin/bash
set -euo pipefail

version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' packaging/Info.plist)"
[[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'CFBundleShortVersionString must be x.y.z' >&2; exit 1; }
app="$PWD/dist/Push2Talk.app"
rm -rf "$app"
mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
cp packaging/Info.plist "$app/Contents/Info.plist"
/bin/bash scripts/generate-app-icon.sh packaging/AppIcon.png "$app/Contents/Resources/AppIcon.icns"
/usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$app/Contents/Info.plist"
/usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" "$app/Contents/Info.plist"

if [[ "${P2T_UNIVERSAL:-0}" == 1 ]]; then
  swift build -c release --arch arm64 --arch x86_64 --scratch-path .build --cache-path .build/cache
  binary_dir="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path --scratch-path .build --cache-path .build/cache)"
else
  swift build -c release --scratch-path .build --cache-path .build/cache
  binary_dir="$(swift build -c release --show-bin-path --scratch-path .build --cache-path .build/cache)"
fi
cp "$binary_dir/Push2Talk" "$app/Contents/MacOS/Push2Talk"

identity="${P2T_SIGN_IDENTITY:--}"
if [[ "$identity" == '-' ]]; then
  codesign --force --sign - "$app"
else
  codesign --force --options runtime --timestamp --sign "$identity" "$app"
fi
codesign --verify --strict "$app"
archive="$PWD/dist/Push2Talk-$version.zip"
ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
if [[ -n "${P2T_NOTARY_PROFILE:-}" ]]; then
  [[ "$identity" != '-' ]] || { echo 'Notarization requires a Developer ID signing identity.' >&2; exit 1; }
  xcrun notarytool submit "$archive" --keychain-profile "$P2T_NOTARY_PROFILE" --wait
  xcrun stapler staple "$app"
  xcrun stapler validate "$app"
  ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
fi
shasum -a 256 "$archive" > "$archive.sha256"
echo "Built $app"
echo "Archive: $archive"
'''

[tasks.build-install]
description = "Build the app, install it in /Applications, and launch settings"
depends = ["bundle"]
dir = "{{ config_root }}"
run = '''
#!/bin/bash
set -euo pipefail
exec "{{ mise_bin }}" run install-local "$@"
'''

[tasks.install-local]
description = "Install the built app in /Applications and launch settings"
dir = "{{ config_root }}"
run = '''
#!/bin/bash
set -euo pipefail

source_app="$PWD/dist/Push2Talk.app"
target_app="/Applications/Push2Talk.app"
launch_app=1
if [[ $# == 1 && "$1" == '--no-launch' ]]; then
  launch_app=0
elif [[ $# != 0 ]]; then
  echo 'Usage: mise run install-local [--no-launch]' >&2
  exit 1
fi
[[ -x "$source_app/Contents/MacOS/Push2Talk" ]] || { echo 'Build dist/Push2Talk.app first.' >&2; exit 1; }
codesign --verify --strict "$source_app"
if [[ -e "$target_app" ]]; then
  identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$target_app/Contents/Info.plist")"
  [[ "$identifier" == 'com.ut0s.Push2Talk' ]] || { echo 'Destination belongs to another app.' >&2; exit 1; }
fi
if pgrep -x Push2Talk >/dev/null; then
  osascript -e 'tell application id "com.ut0s.Push2Talk" to quit'
  for ((attempt = 0; attempt < 30; attempt++)); do
    if ! pgrep -x Push2Talk >/dev/null; then break; fi
    sleep 0.1
  done
  if pgrep -x Push2Talk >/dev/null; then
    echo 'Push2Talk is still running. Quit it before installing.' >&2
    exit 1
  fi
fi
ditto "$source_app" "$target_app"
codesign --verify --strict "$target_app"
# Refresh bundle metadata before other apps request the new process's icon.
touch "$target_app"
/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$target_app"
if [[ "$launch_app" == 1 ]]; then
  open "$target_app" --args --settings
fi
echo "Installed $target_app"
echo 'Register this installed copy in System Settings. Rebuilding dist does not replace it.'
'''

[tasks.prepare-homebrew]
description = "Generate the public Homebrew Cask and README from an existing archive"
dir = "{{ config_root }}"
run = '''
#!/bin/bash
set -euo pipefail

if [[ $# != 2 ]]; then
  echo 'Usage: mise run prepare-homebrew OWNER/homebrew-push2talk VERSION' >&2
  exit 1
fi
distribution_repo="$1"
version="$2"
owner="${distribution_repo%%/*}"
tap="${distribution_repo#*/homebrew-}"
[[ "$distribution_repo" =~ ^[A-Za-z0-9_-]+/homebrew-[A-Za-z0-9_-]+$ ]] || { echo 'Expected OWNER/homebrew-NAME' >&2; exit 1; }
[[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected x.y.z version' >&2; exit 1; }
archive="$PWD/dist/Push2Talk-$version.zip"
[[ -f "$archive" ]] || { echo "Build $archive first" >&2; exit 1; }
checksum="$(shasum -a 256 "$archive" | awk '{print $1}')"
tap_dir="$PWD/dist/homebrew-push2talk"
mkdir -p "$tap_dir/Casks"
cat > "$tap_dir/Casks/push2talk.rb" <<EOF
cask "push2talk" do
  version "$version"
  sha256 "$checksum"

  url "https://github.com/$distribution_repo/releases/download/v#{version}/Push2Talk-#{version}.zip"
  name "Push2Talk"
  desc "Hold right Option to use macOS Dictation, release to finish, with optional Enter submission"
  homepage "https://github.com/$distribution_repo"

  livecheck do
    url :url
    strategy :github_latest
  end

  depends_on macos: :ventura
  app "Push2Talk.app"

  zap trash: "~/Library/Preferences/com.ut0s.Push2Talk.plist"

  caveats do
    <<~EOS
      First launch:
        open "#{appdir}/Push2Talk.app"

      macOS may block apps that have not been notarized by Apple.
      Only if you trust the source, verify the app signature first:
        codesign --verify --deep --strict --verbose=2 "#{appdir}/Push2Talk.app"
      Only after verification succeeds, remove quarantine and launch the app:
        xattr -dr com.apple.quarantine "#{appdir}/Push2Talk.app"
        open "#{appdir}/Push2Talk.app"
      Signature verification does not establish the developer's identity.
      If verification fails, obtain a fresh copy before proceeding.

      Setup after launch:
        1. Enable Dictation in System Settings > Keyboard > Dictation.
        2. Set the Dictation shortcut to press right Command twice.
           If you use another shortcut, select the matching one in Push2Talk.
        3. Allow Push2Talk in System Settings > Privacy & Security > Accessibility.
           If key monitoring cannot start, also check Input Monitoring.
        4. Complete initial setup and recheck permissions in Push2Talk's settings.
           Restart Push2Talk if permission changes are not reflected.

      To dictate, focus a text field, hold right Option, and speak; release to finish.
      Automatic Enter submission is off by default.
      Show these instructions again: brew info --cask $owner/$tap/push2talk
    EOS
  end
end
EOF
cat > "$tap_dir/README.md" <<EOF
# Push2Talk

macOS 13 or later. Hold right Option to start macOS Dictation; release to finish. Automatic Enter submission is optional and off by default.

\`\`\`sh
brew tap $owner/$tap
brew install --cask push2talk
open -a Push2Talk
\`\`\`

Enable Dictation in System Settings → Keyboard and set its shortcut to right Command twice.
Grant Push2Talk Accessibility permission and complete setup in the menu bar.
The app settings support other double-press Dictation shortcuts.

## First launch

Ad-hoc builds are not notarized by Apple and macOS may block downloaded copies.
For a copy from a source you trust, verify its signature first:

\`\`\`sh
codesign --verify --deep --strict --verbose=2 /Applications/Push2Talk.app
\`\`\`

Only after verification succeeds, remove quarantine from this app and launch it:

\`\`\`sh
xattr -dr com.apple.quarantine /Applications/Push2Talk.app
open -a Push2Talk
\`\`\`

If verification fails, obtain a fresh copy before proceeding.
Developer ID signed and notarized builds do not normally need this step.

## Update

\`\`\`sh
brew update
brew upgrade --cask push2talk
\`\`\`

If Accessibility permission stops working after an update, re-register Push2Talk
in System Settings and restart the app.
EOF
ruby -c "$tap_dir/Casks/push2talk.rb"
echo "Prepared $tap_dir"
echo "Release asset: $archive"
echo "Install after publication: brew install --cask $owner/$tap/push2talk"
'''

[tasks.prepare-release]
description = "Prepare Universal app and Homebrew Cask locally"
dir = "{{ config_root }}"
run = '''
#!/bin/bash
set -euo pipefail
exec "{{ mise_bin }}" run release --prepare "$@"
'''

[tasks.release]
description = "Build and publish the Universal app and Homebrew Cask"
dir = "{{ config_root }}"
run = '''
#!/bin/bash
set -euo pipefail
export MISE_BIN="{{ mise_bin }}"
exec /bin/bash scripts/release-homebrew.sh "$@"
'''
